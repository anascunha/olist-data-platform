version: 2

models:
  - name: stg_olist__customers
    description: >
      Modelo de staging dos clientes do Olist. Cada pedido gera um customer_id próprio; o
      cliente final é identificado pelo customer_unique_id. A granularidade é por customer_id
      (cliente-pedido).
    config:
      meta:
        graining: customer_id
        contains_pii: false
        source_system: Olist (Kaggle)
        ingestion_type: full load
        load_frequency: on demand
    columns:
      - name: customer_id
        description: >
          Identificador do cliente no pedido (Chave Primária).
        data_tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: '{{ doc("customer_unique_id") }}'
        data_tests:
          - not_null

      - name: customer_zip_code_prefix
        description: >
          Prefixo de 5 dígitos do CEP do cliente, com zeros à esquerda restaurados.

      - name: customer_city
        description: >
          Cidade do cliente em minúsculas.

      - name: customer_state
        description: >
          UF do cliente.
        data_tests:
          - not_null

      - name: _ingestion_timestamp
        description: '{{ doc("_ingestion_timestamp") }}'

      - name: _source_schema
        description: '{{ doc("_source_schema") }}'

      - name: _source_table
        description: '{{ doc("_source_table") }}'

      - name: _source_database
        description: '{{ doc("_source_database") }}'

      - name: _storage_type
        description: '{{ doc("_storage_type") }}'
