version: 2

sources:
  - name: olist
    description: >
      Dataset público Brazilian E-Commerce da Olist (Kaggle: olistbr/brazilian-ecommerce),
      ingerido na Bronze por databricks/ingestao_bronze.py. Todas as colunas chegam como string.
    catalog: raw
    schema: source_olist
    config:
      loaded_at_field: _ingestion_timestamp

    tables:
      - name: customers
      - name: orders
      - name: order_items
      - name: order_payments
      - name: products
      - name: product_category_name_translation

  - name: crm
    description: >
      CRM genérico com dados fictícios gerado por pipelines/generate_crm.py e ligado aos
      clientes do Olist pelo customer_unique_id.
    catalog: raw
    schema: source_crm
    config:
      loaded_at_field: _ingestion_timestamp

    tables:
      - name: owners
      - name: campaigns
      - name: contacts
      - name: activities
