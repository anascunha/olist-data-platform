version: 2

models:
  - name: stg_olist__order_payments
    description: >
      Modelo de staging dos pagamentos do Olist. Um pedido pode ter vários pagamentos (ex:
      voucher + cartão). A granularidade é por pagamento (order_id + payment_sequential).
    config:
      meta:
        graining: order_payment
        contains_pii: false
        source_system: Olist (Kaggle)
        ingestion_type: full load
        load_frequency: on demand
    columns:
      - name: order_id
        description: >
          Identificador do pedido (Chave Estrangeira).
        data_tests:
          - not_null

      - name: payment_sequential
        description: >
          Sequência do pagamento dentro do pedido.
        data_tests:
          - not_null

      - name: payment_type
        description: >
          Forma de pagamento.
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']

      - name: payment_installments
        description: >
          Número de parcelas.

      - name: payment_value
        description: >
          Valor pago em BRL.
        data_tests:
          - not_null

      - name: _ingestion_timestamp
        description: '{{ doc("_ingestion_timestamp") }}'

      - name: _source_schema
        description: '{{ doc("_source_schema") }}'

      - name: _source_table
        description: '{{ doc("_source_table") }}'

      - name: _source_database
        description: '{{ doc("_source_database") }}'

      - name: _storage_type
        description: '{{ doc("_storage_type") }}'
