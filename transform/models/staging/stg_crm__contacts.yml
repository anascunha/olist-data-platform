version: 2

models:
  - name: stg_crm__contacts
    description: >
      Modelo de staging dos contatos do CRM, 1:1 com a origem. O export contém o mesmo
      contact_id mais de uma vez (versões antigas); a deduplicação ocorre em tru_crm_contacts.
      Normaliza e-mail (trim + minúsculas) e telefone (E.164). A granularidade é por versão do
      contato.
    config:
      meta:
        graining: contact_version
        contains_pii: true
        source_system: CRM fictício
        ingestion_type: full load
        load_frequency: on demand
    columns:
      - name: contact_id
        description: >
          Identificador do contato. Não é único nesta camada (ver tru_crm_contacts).
        data_tests:
          - not_null

      - name: customer_unique_id
        description: >
          Chave de ligação com o cliente do Olist. Nula para contatos que só existem no CRM.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_olist__customers')
                field: customer_unique_id

      - name: first_name
        description: >
          Primeiro nome do contato.

      - name: last_name
        description: >
          Sobrenome do contato.

      - name: email
        description: >
          E-mail normalizado (trim + minúsculas). Nulo quando vazio na origem.

      - name: phone_e164
        description: >
          Telefone normalizado no padrão E.164 (+55DDDNUMERO).
        data_tests:
          - not_null

      - name: birth_date
        description: >
          Data de nascimento.

      - name: contact_city
        description: >
          Cidade do contato.

      - name: contact_state
        description: >
          UF do contato.

      - name: lifecycle_stage
        description: '{{ doc("lifecycle_stage") }}'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['lead', 'mql', 'opportunity', 'customer', 'churned', 'disqualified']

      - name: lead_source
        description: >
          Origem do contato: canal da campanha ou origem orgânica.
        data_tests:
          - not_null

      - name: campaign_id
        description: >
          Campanha que originou o contato (Chave Estrangeira).
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_crm__campaigns')
                field: campaign_id

      - name: owner_id
        description: >
          Responsável pelo contato (Chave Estrangeira).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_crm__owners')
                field: owner_id

      - name: marketing_opt_in
        description: >
          Consentimento para comunicações de marketing.

      - name: created_at
        description: >
          Data de criação do contato no CRM.
        data_tests:
          - not_null

      - name: updated_at
        description: >
          Data da última atualização do contato.
        data_tests:
          - not_null

      - name: _ingestion_timestamp
        description: '{{ doc("_ingestion_timestamp") }}'

      - name: _source_schema
        description: '{{ doc("_source_schema") }}'

      - name: _source_table
        description: '{{ doc("_source_table") }}'

      - name: _source_database
        description: '{{ doc("_source_database") }}'

      - name: _storage_type
        description: '{{ doc("_storage_type") }}'
