name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:


  # Job 2: Linting de Código Python
  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff (Linter)
        run: ruff check .

  # Job 3: Testes Unitários com Pytest
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    needs: python-lint
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest pytest-mock kaggle

      - name: Run unit tests
        run: pytest --tb=short -v

  # Os próximos Jobs (dbt tests, sqlfluff) serão adicionados na Fase 4
